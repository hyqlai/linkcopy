[package]
name = "linkcopy"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Copy a directory tree on Windows without losing NTFS junctions or symlinks"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
junction = "2.1.0"

[dev-dependencies]
tempfile = "3.27.0"
